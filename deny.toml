# cargo-deny policy for the resolved Hipfire workspace dependency graph.
# Keep the allowlist narrow: every added license or source should be reviewed.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# Hipfire's workspace crates intentionally use versionless sibling path
# dependencies. Registry and git provenance is enforced separately below.
wildcards = "allow"
highlight = "all"
skip = [
    { name = "hashbrown", version = "=0.16.1", reason = "safetensors 0.8 and ratatui 0.30 currently resolve adjacent hashbrown releases" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
