name: Gate Backlog Sweep

# Backlog sweep (spec §11.1): gate all open eligible PRs, PUNT any that regress perf
# or fail functionally, and stack the rest onto the collection branch (kernel-oracle),
# resolving merge conflicts via the Gate-4 codex merge-fix (perf-preserving supersede on
# a perf-lost-in-merge). This job only STACKS onto the collection branch — it does NOT
# land on master; a maintainer lands the proven-non-clobbering stack separately (auto-
# merge stays gated by GATE_AUTOMERGE).
#
# workflow_dispatch ONLY (not scheduled): the first sweep should be a deliberate, watched
# run. It is LIVE — daemon builds + codex + GPU on a self-hosted box.

on:
  workflow_dispatch:
    inputs:
      collection:
        description: "collection branch to stack the approved PRs onto"
        default: "feat/rdna-kernel-oracle"
      arch:
        description: "arch to gate on (gfx1201 | gfx1100 | gfx1151)"
        default: "gfx1201"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gate-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep backlog -> ${{ inputs.collection }}
    runs-on: [self-hosted, "${{ inputs.arch }}"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sweep the backlog (gpu-lock serialized)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          source scripts/gpu-lock.sh
          gpu_acquire "gate-sweep"
          trap gpu_release EXIT
          # Gate every open eligible PR; punt regressions; stack the approved onto the
          # collection branch. Prints {train, punted, superseded}.
          python3 -m autoresearch.ar gate --sweep \
            --collection "${{ inputs.collection }}" --arch "${{ inputs.arch }}" \
            | tee sweep_result.json
          cat sweep_result.json
      - name: Upload sweep result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-result
          path: sweep_result.json
          if-no-files-found: warn
