name: GPU PR Gate (Tier 3)

# Tier 3 of the validation pipeline (see docs/specs/2026-07-10-agentic-pr-merge-gate-design.md):
# a self-hosted GPU gate. Each arch runs `ar gate --run` on the box that OWNS that
# arch (gfx1100/gfx1151 -> hipx, gfx1201 -> hiptrx); an interpret job aggregates the
# per-arch results into a PR verdict + comment (merge/tag/BOD).
#
# Trust boundary (mirrors claude-review.yml): this runs PR *code* on real GPUs, so it
# auto-runs ONLY on in-repo maintainer PRs that are Open and not Draft; fork PRs and
# non-maintainers require a maintainer `/gate` comment. The `decide` job enforces this
# before any self-hosted job is scheduled.
#
# STATUS: the self-hosted runners are Phase-0 (not yet registered) and auto-merge is
# deliberately NOT wired here yet (the interpret job posts the verdict comment only).
# Until the runners exist the `gate`/`interpret` jobs simply never satisfy `decide`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

concurrency:
  group: gpu-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  decide:
    name: should-run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      base: ${{ steps.g.outputs.base }}
      head: ${{ steps.g.outputs.head }}
      pr: ${{ steps.g.outputs.pr }}
      author: ${{ steps.g.outputs.author }}
      draft: ${{ steps.g.outputs.draft }}
    steps:
      - id: g
        uses: actions/github-script@v7
        with:
          script: |
            const MAINTAINERS = ["fivetide", "unverbraucht", "nwoolmer", "Kaden-Schutt"];
            let run = false;
            let pr = null;
            if (context.eventName === "pull_request") {
              const p = context.payload.pull_request;
              // Auto only for in-repo (non-fork) maintainer PRs, open + non-draft.
              const inRepo = p.head.repo.full_name === context.payload.repository.full_name;
              run = inRepo && !p.draft && MAINTAINERS.includes(p.user.login);
              pr = p;
            } else if (context.eventName === "issue_comment") {
              const c = context.payload.comment;
              const isPR = Boolean(context.payload.issue.pull_request);
              if (isPR && MAINTAINERS.includes(c.user.login) && c.body.trim().startsWith("/gate")) {
                const got = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.issue.number,
                });
                pr = got.data;
                run = true;
              }
            }
            if (run && pr) {
              core.setOutput("run", "true");
              core.setOutput("base", pr.base.sha);
              core.setOutput("head", pr.head.sha);
              core.setOutput("pr", String(pr.number));
              core.setOutput("author", pr.user.login);
              core.setOutput("draft", String(pr.draft));
            } else {
              core.setOutput("run", "false");
            }

  gate:
    name: gpu-gate / ${{ matrix.arch }}
    needs: decide
    if: ${{ needs.decide.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [gfx1100, gfx1151, gfx1201]
    runs-on: [self-hosted, "${{ matrix.arch }}"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run the arch gate (gpu-lock serialized)
        run: |
          set +e
          source scripts/gpu-lock.sh
          gpu_acquire "gpu-gate-${{ needs.decide.outputs.pr }}-${{ matrix.arch }}"
          trap gpu_release EXIT
          mkdir -p results
          python3 -m autoresearch.ar gate --run --arch "${{ matrix.arch }}" \
            --base "${{ needs.decide.outputs.base }}" \
            --head "${{ needs.decide.outputs.head }}" \
            --pr "${{ needs.decide.outputs.pr }}" \
            --author "${{ needs.decide.outputs.author }}" \
            > "results/${{ matrix.arch }}.json"
          rc=$?
          cat "results/${{ matrix.arch }}.json"
          exit $rc
      - name: Upload arch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-result-${{ matrix.arch }}
          path: results/${{ matrix.arch }}.json

  interpret:
    name: interpret + verdict
    needs: [decide, gate]
    if: ${{ always() && needs.decide.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: gate-result-*
          merge-multiple: true
      - name: Interpret aggregate + decide
        id: interp
        run: |
          python3 -m autoresearch.ar gate --interpret --results results \
            --base "${{ needs.decide.outputs.base }}" \
            --head "${{ needs.decide.outputs.head }}" \
            --pr "${{ needs.decide.outputs.pr }}" \
            --author "${{ needs.decide.outputs.author }}" \
            ${{ needs.decide.outputs.draft == 'true' && '--draft' || '' }} \
            | tee interp.txt
      - name: Post the verdict comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const txt = fs.readFileSync("interp.txt", "utf8");
            const parts = txt.split("--- PR comment ---");
            const body = (parts[1] || txt).trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ needs.decide.outputs.pr }}"),
              body: "### GPU PR Gate (Tier 3)\n\n" + body,
            });
            // NOTE (Phase-3b follow-up): the merge/tag ACTION (auto_merge for
            // Kaden's PRs, @claude /merge tag for other maintainers) is intentionally
            // NOT wired yet — this job posts the verdict only. Auto-merge is the one
            // capability that grants an agent write access; it is enabled deliberately
            // (spec §12/§20) after the gate has proven itself, behind the kill-switch.
