name: Gate Merge Command

# The manual-approval merge path for maintainers (spec §12). A maintainer comments
# `/merge` on a PR whose gpu-gate (Tier 3) is green, and the AGENT merges it on their
# behalf — their GitHub permissions are unchanged; the `/merge` comment is their
# explicit approval, and the agent executes. (Kaden-Schutt's PRs auto-merge via
# gpu-gates.yml; this is how the OTHER maintainers land theirs, and how a maintainer
# lands a non-maintainer PR they vetted.)
#
# Hard rule: the agent NEVER merges unless the gpu-gate check-runs on the PR head are
# ALL green — it re-confirms here, so a required-status-check config is not relied upon.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: /merge (agent merges on maintainer's behalf)
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/merge') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify maintainer + gpu-gate green, then merge
        uses: actions/github-script@v7
        with:
          script: |
            const MAINTAINERS = ["fivetide", "unverbraucht", "nwoolmer", "Kaden-Schutt"];
            const commenter = context.payload.comment.user.login;
            const prNum = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const say = (body) => github.rest.issues.createComment({ owner, repo, issue_number: prNum, body });

            // Only a real `/merge` (or `@claude /merge`) command from a maintainer acts.
            const body = (context.payload.comment.body || "").trim();
            const isMergeCmd = body === "/merge" || body.startsWith("/merge") || body.includes("@claude /merge");
            if (!isMergeCmd) return;
            if (!MAINTAINERS.includes(commenter)) {
              await say(`\`/merge\` ignored — @${commenter} is not a maintainer.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNum });
            if (pr.state !== "open") { await say("`/merge` — PR is not open."); return; }

            // Re-confirm the gpu-gate is green on the CURRENT head (never merge on a stale/red gate).
            const { data: checks } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha });
            const gates = checks.check_runs.filter((c) => c.name.startsWith("gpu-gate"));
            if (gates.length === 0) {
              await say("❌ `/merge`: no gpu-gate results on this PR head — run `/gate` first.");
              return;
            }
            const red = gates.filter((c) => c.conclusion !== "success").map((c) => c.name);
            if (red.length > 0) {
              await say(`❌ \`/merge\`: gpu-gate not green (${red.join(", ")}). Fix + re-run \`/gate\`.`);
              return;
            }

            await github.rest.pulls.merge({ owner, repo, pull_number: prNum, merge_method: "merge" });
            await say(`✅ Merged on behalf of @${commenter} — gpu-gate green (${gates.map((c) => c.name).join(", ")}).`);
