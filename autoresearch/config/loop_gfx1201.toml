# autoresearch/config/loop_gfx1201.toml — the gfx1201 (R9700) shared-kernel loop.
# One file per arch. Nothing here is hardcoded elsewhere; the loop reads it all.
arch          = "gfx1201"
baseline_ref  = "loop/gfx1201"          # the kernel source of truth this loop advances
model         = "qwen3.6-35b-a3b.mq4r"  # measurement SKU (mq4r for the shared-kernel loop)
kv_mode       = "q8"
max_tokens    = 128
prompt_md5    = "d97ec9d3f761ec68093631be27d32441"
cand_wall     = 3.0                     # min BOD wall% to be a candidate
k_exhaust     = 5                       # 5 tests/kernel: consecutive DEAD/INCONCLUSIVE ⇒ EXHAUSTED (a WIN resets)
agent_harness = "codex"

# Per-worker heterogeneity — the sed-munge replacement. Luna@max card1,
# Terra@xhigh card2, Sol@medium card3 (Sol/Terra/Luna unbiased lever-finders).
[[workers]]
card   = 1
dev    = 1
model  = "gpt-5.6-luna"
effort = "max"

[[workers]]
card   = 2
dev    = 2
model  = "gpt-5.6-terra"
effort = "xhigh"

[[workers]]
card   = 3
dev    = 3
model  = "gpt-5.6-sol"
effort = "medium"

[bounds]                                # watcher leashes
call_budget = 400
wall_ttl_s  = 43200
