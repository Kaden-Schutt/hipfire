# Canonical hipfire model-support matrix — SINGLE SOURCE OF TRUTH.
#
# Edit THIS file, then regenerate the derived artifacts:
#     cargo run -p hipfire-cli -- gen-model-support
# which writes:
#   - crates/hipfire-model/src/model_support_generated.rs  (the compiled tables
#     that `arch_features` / admission consume)
#   - the matrix chart inside MODEL-SUPPORT.md (between the generated markers)
#
# CI freshness gate (tests/no-gpu-ci.sh) runs `gen-model-support --check`, which
# fails if the committed artifacts have drifted from this file.
#
# support marks: "full" | "partial" | "none"  (rendered ✓ / ~ / · in the chart;
# `full` is the only value admission gating treats as a pass — see is_full()).

# ── Per-arch capability matrix (keyed by HFQ arch_id) ──────────────────────────

[[arch]]
ids = [5, 6]
label = "qwen3.5"
prefill = "full"
dflash = "full"
mtp = "full"
kv = "full"
vision = "partial"

