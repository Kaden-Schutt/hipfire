# ── Quant-format catalog (the authored per-quant axis) ─────────────────────────
# status: "stable" | "opt-in" | "experimental"

[[quant]]
name = "bf16"
label = "BF16 (unquantized)"
weight_bits = 16
act_bits = 16
status = "stable"

[[quant]]
name = "q8"
label = "Q8 (W8A16)"
weight_bits = 8
act_bits = 16
status = "stable"

[[quant]]
name = "mq4"
label = "Magnum / MQ4 (W4A16)"
weight_bits = 4
act_bits = 16
status = "stable"

[[quant]]
name = "mq6"
label = "Magnum / MQ6 (W6A16)"
weight_bits = 6
act_bits = 16
status = "stable"

[[quant]]
name = "oq4"
label = "Opus / OQ4+ (4-bit-resident; W4A16 decode, W4A4 batched prefill)"
weight_bits = 4
act_bits = 4
status = "opt-in"

[[quant]]
name = "oq8"
label = "Opus / OQ8+ (W4A8, 4-bit weights int8-resident)"
weight_bits = 4
act_bits = 8
status = "opt-in"

[[quant]]
name = "mq3"
label = "Magnum / MQ3 (W3A16, mixed-precision only)"
weight_bits = 3
act_bits = 16
status = "experimental"

# ── Intentional (arch × quant × feature) gates ─────────────────────────────────
# Overrides an arch-level capability for a specific quant. The per-quant axis the
# arch matrix can't express: e.g. qwen3.5 prefill is `full`, but W4A4 prefill is
# parity-gated and opt-in. Admission consults these BEFORE green-lighting.

[[gate]]
arch = 5
quant = "oq4"
feature = "prefill"
support = "partial"
note = "W4A4 (OQ4) batched prefill is parity-gated / opt-in (HIPFIRE WMMA path)"

[[gate]]
arch = 5
quant = "oq8"
feature = "prefill"
support = "partial"
note = "W8A8 (OQ8) batched-prefill WMMA path is experimental / parity-gated"
