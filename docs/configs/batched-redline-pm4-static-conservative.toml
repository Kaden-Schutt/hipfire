# Register-policy isolator for fixed-slot sampled batch replay.
# Differs from the certified conservative profile only by selecting static
# queue-global register emission.
schema_version = 1

[replay]
backend = "shadow"
transport = "pm4"

[diagnostic.replay]
independent_batch = true
manual_capture = true
pm4_queues = "1"
pm4_register_policy = "static"
pm4_wait_policy = "allowlist"
pm4_acquire_policy = "conservative"
pm4_gcr_trim = false
pm4_dynamic_grid = false

[speculation]
mode = "off"
dflash = "off"
mtp = "off"
ngram = "off"

[memory]
kv_cache = "q8"

[generation]
loop_guard_threshold = 0
