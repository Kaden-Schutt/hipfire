# Example ~/.hipfire/config.toml for normal run and serve usage.
# Delete a key to return it to registry/compiled inheritance.
schema_version = 1

[generation]
# Sampling fields are intentionally omitted here so each registry model card can
# supply its complete recommended recipe. Pin overrides per model with, e.g.:
#   hipfire config qwen3.6:35b-a3b-mq4r set generation.temperature 0.8
#   hipfire config qwen3.6:35b-a3b-mq4r set generation.top_k 20
max_tokens = 4096
loop_guard_threshold = 0
loop_guard_window = 256

[reasoning]
mode = "on"
budget = "xhigh"
max_total_tokens = 0

[memory]
# Replaces HIPFIRE_KV_MODE=q8.
kv_cache = "q8"
max_seq = 32768
# Replaces HIPFIRE_PROMPT_CACHE_CAP=32.
prompt_cache_capacity = 32
prompt_cache_unbounded = false

[attention]
# Replaces HIPFIRE_ATTN_FLASH=auto.
flash = "auto"

[prompt]
# Replaces HIPFIRE_NORMALIZE_PROMPT=1.
normalize = true
default_chatml = true

[speculation]
# Replaces HIPFIRE_SPECULATION=auto.
mode = "auto"
# DFlash remains opt-in. Replaces HIPFIRE_DFLASH_MODE=off.
dflash = "off"
mtp = "auto"
mtp_k = 3
ngram = "off"

[serve]
host = "0.0.0.0"
port = 11435
# Replaces HIPFIRE_IDLE_TIMEOUT=300.
idle_timeout_seconds = 300
local = false
