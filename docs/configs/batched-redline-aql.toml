# Isolated diagnostic profile for fixed-slot sampled Redline AQL certification.
# This separates capture/replay correctness from PM4 lowering correctness.
schema_version = 1

[replay]
backend = "redline"
transport = "aql"

[diagnostic.replay]
independent_batch = true
manual_capture = false

[speculation]
mode = "off"
dflash = "off"
mtp = "off"
ngram = "off"

[memory]
kv_cache = "q8"

[generation]
loop_guard_threshold = 0
