[package]
name = "saddle-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Archived research harnesses and legacy benchmarks — not part of the default build graph. Each binary builds on request via `cargo build -p saddle-lab --examples` or `cargo build --workspace --all-targets`."

[features]
# Archived research probes; see the note by the [[example]] blocks.
lab = []
default = ["deltanet", "arch-qwen35", "arch-qwen35-vl", "arch-llama", "arch-qwen2", "arch-deepseek4", "arch-cohere2moe", "arch-dots-ocr", "arch-gemma4", "arch-muse-glimmer"]
deltanet = ["rdna-compute/deltanet", "hipfire-dispatch/deltanet"]
arch-qwen35 = []
arch-qwen35-vl = []
arch-llama = []
arch-qwen2 = []
arch-deepseek4 = []
arch-cohere2moe = []
arch-dots-ocr = []
arch-gemma4 = []
arch-muse-glimmer = []
ep-fault-inject = []
serve-fault-inject = []

[dependencies]
hip-bridge = { path = "../hip-bridge" }
hipfire-config = { path = "../hipfire-config" }
rdna-compute = { path = "../rdna-compute" }
hipfire-dispatch = { path = "../hipfire-dispatch" }
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-arch-qwen35 = { path = "../hipfire-arch-qwen35" }
hipfire-arch-qwen35-vl = { path = "../hipfire-arch-qwen35-vl" }
hipfire-arch-llama = { path = "../hipfire-arch-llama" }
hipfire-arch-lfm2moe = { path = "../hipfire-arch-lfm2moe" }
hipfire-arch-gemma4 = { path = "../hipfire-arch-gemma4" }
hipfire-arch-muse-glimmer = { path = "../hipfire-arch-muse-glimmer" }
hipfire-detect = { path = "../hipfire-detect" }
byteorder = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
libc = "0.2"

# ── Archived examples (relocated from hipfire-runtime) ───────────────────
# Each entry was `[[example]]` in hipfire-runtime/Cargo.toml with an identical
# `required-features` gate. The gate is preserved here so `cargo build -p
# saddle-lab --examples` reproduces the same feature matrix, but the default
# build graph (`cargo build`) no longer compiles them.

