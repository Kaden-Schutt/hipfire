[package]
name = "hipfire-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Top-of-DAG model loader / carrier registry for hipfire"

[features]
default = [
    "arch-qwen35", "arch-qwen35-vl", "arch-llama", "arch-qwen2",
    "arch-deepseek4", "arch-dots-ocr",
]
arch-qwen35 = ["dep:hipfire-arch-qwen35"]
arch-qwen35-vl = ["dep:hipfire-arch-qwen35-vl"]
arch-llama = ["dep:hipfire-arch-llama"]
arch-qwen2 = ["dep:hipfire-arch-qwen2"]
arch-deepseek4 = ["dep:hipfire-arch-deepseek4"]
arch-dots-ocr = ["dep:hipfire-arch-dots-ocr"]
# Test-only forwarding for the Qwen35 legacy-vs-dispatch parity seam.
test-utils = ["arch-qwen35", "hipfire-arch-qwen35/test-utils"]
# Test-only: compile the HIPFIRE_EP_FAIL_RANK partial-load fault injector. OFF by
# default so production builds can never synthetically fail an EP load.
ep-fault-inject = []
dflash-fault-inject = [
    "hipfire-runtime/dflash-fault-inject",
    "hipfire-arch-llama/dflash-fault-inject",
]

[dependencies]
rdna-compute = { path = "../rdna-compute" }
hipfire-config = { path = "../hipfire-config" }
hipfire-runtime = { path = "../hipfire-runtime", features = ["loader-internal"] }
hip-bridge = { path = "../hip-bridge" }
# Optional arch crate deps — feature-gated.
hipfire-arch-qwen35 = { path = "../hipfire-arch-qwen35", optional = true }
hipfire-arch-qwen35-vl = { path = "../hipfire-arch-qwen35-vl", optional = true }
hipfire-arch-llama = { path = "../hipfire-arch-llama", optional = true }
hipfire-arch-qwen2 = { path = "../hipfire-arch-qwen2", optional = true }
hipfire-arch-deepseek4 = { path = "../hipfire-arch-deepseek4", optional = true }
hipfire-arch-dots-ocr = { path = "../hipfire-arch-dots-ocr", optional = true }
# Non-optional arch deps — LoadedModel struct references these types.
hipfire-arch-lfm2moe = { path = "../hipfire-arch-lfm2moe" }
hipfire-arch-minimax = { path = "../hipfire-arch-minimax" }
hipfire-arch-cohere2moe = { path = "../hipfire-arch-cohere2moe" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "qwen35_parity_compile"
path = "tests/qwen35_parity_compile.rs"
required-features = ["test-utils"]
