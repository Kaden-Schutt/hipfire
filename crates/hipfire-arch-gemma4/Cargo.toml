[package]
name = "hipfire-arch-gemma4"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gemma 4 architecture (hybrid sliding+full attention, dense/MoE FFN) for hipfire"

[dependencies]
hipfire-runtime = { path = "../hipfire-runtime" }
hip-bridge = { path = "../hip-bridge" }
rdna-compute = { path = "../rdna-compute" }
hipfire-dispatch = { path = "../hipfire-dispatch" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
safetensors = "0.7"
memmap2 = "0.9"
