[package]
name = "hipfire-quantize"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hipfire-config = { path = "../hipfire-config" }
memmap2 = "0.9"
safetensors.workspace = true
half.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
rayon = "1"
libc = "0.2"
hipfire-reap = { path = "../hipfire-reap" }

[dev-dependencies]
tempfile = "3"
# CPU-only reader for the overlay round-trip test: HfqFile parses the .hfq
# container header/index by name without touching the GPU (builds on CPU).
# hipfire-quantize is a binary crate (no lib target), so the overlay
# integration test lives in-module in reap_overlay.rs (it needs crate-internal
# write_hfq / quantize_* access that a tests/ target can't reach).
hipfire-runtime = { path = "../hipfire-runtime" }
# Test-only: the MQ*-G256-GL codebooks (GL_CB2/GL_CB3) and SoA group sizes are
# duplicated between this encoder and the runtime (the kernels take the codebook
# as scalar args; it is NOT stored in the .hfq). `gl_codebooks_match_runtime` /
# `gl_blob_layout_matches_runtime_constants` in main.rs assert the two copies are
# identical, so a drift becomes a red test instead of a silent accuracy loss.
# dev-dependency only — the quantizer still builds and runs with no GPU/ROCm.
rdna-compute = { path = "../rdna-compute" }
