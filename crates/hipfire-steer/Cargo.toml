[package]
name = "hipfire-steer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Refusal-direction steering / abliteration: derive per-block contrastive directions from +/- residual captures and apply them at the block-boundary residual (additive steer or projective ablate) on the quantized inference path. Directions also materialize as a rank-1 residual LoRA (lora module) for a stackable, intensity-adjustable adapter. No quant round-trip. See docs/plans/2026-06-30-abliteration-lora.md."

# Phase 1 (MVP) status: crate skeleton + block-boundary hook. Capture and the
# host round-trip reference apply are functional; on-GPU apply, hipfire-kld
# scoring, and the search loop are the remaining Phase 2-4 work.

[dependencies]
hipfire-rdna = { path = "../hipfire-rdna" }
hip-bridge = { path = "../hip-bridge" }
serde.workspace = true
serde_json = "1"
# Phase 3 will add: hipfire-kld (capability-damage objective), hipfire-eval
# (refusal-marker / classifier objective + driver).
