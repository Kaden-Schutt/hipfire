[package]
name = "hipfire-arch-qwen35"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qwen3.5 architecture (dense + MoE) for hipfire"

[features]
# Enable hybrid DeltaNet + speculative decoding paths. Currently always-on
# because qwen35 is a hybrid arch (DeltaNet + FullAttention layers).
default = ["deltanet"]
deltanet = ["hipfire-runtime/deltanet", "rdna-compute/deltanet"]
flash-attn-ck = ["hipfire-dispatch/flash-attn-ck", "rdna-compute/flash-attn-ck"]

[dependencies]
hipfire-config = { path = "../hipfire-config" }
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-arch-qwen35-vl = { path = "../hipfire-arch-qwen35-vl" }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["from-hip-error"] }
hip-bridge = { path = "../hip-bridge" }
rdna-compute = { path = "../rdna-compute" }
hipfire-reap = { path = "../hipfire-reap", default-features = false }
saddle-core = { path = "../saddle-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# G4b (Escha-W2 Task 9): `examples/escha_router_contract.rs` reads the escha
# fixture's f16 golden buffers via the same decoder the frozen CPU oracle
# uses (`hipfire_quantize::float16::f16_to_f32`).
hipfire-quantize = { path = "../hipfire-quantize" }

[[example]]
name = "escha_model_smoke"
path = "examples/escha_model_smoke.rs"
required-features = ["deltanet"]

[[example]]
name = "escha_moe_block_gate"
path = "examples/escha_moe_block_gate.rs"
required-features = ["deltanet"]

[[example]]
name = "escha_router_contract"
path = "examples/escha_router_contract.rs"

[[example]]
name = "escha_prefill_batch_gate"
path = "examples/escha_prefill_batch_gate.rs"
required-features = ["deltanet"]

[[example]]
name = "test_qwen35_load_multi"
path = "examples/test_qwen35_load_multi.rs"
required-features = ["deltanet"]

[[example]]
name = "test_qwen35_state_multi"
path = "examples/test_qwen35_state_multi.rs"
required-features = ["deltanet"]

[[example]]
name = "mtp_head_smoke"
path = "examples/mtp_head_smoke.rs"
required-features = ["deltanet"]

[[example]]
name = "qwen_dense_tp2_parity"
path = "examples/qwen_dense_tp2_parity.rs"
required-features = ["deltanet"]
