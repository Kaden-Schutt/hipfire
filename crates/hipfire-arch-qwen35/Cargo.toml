[package]
name = "hipfire-arch-qwen35"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qwen3.5 architecture (dense + MoE) for hipfire"

[features]
# Enable hybrid DeltaNet + speculative decoding paths. Currently always-on
# because qwen35 is a hybrid arch (DeltaNet + FullAttention layers).
default = ["deltanet"]
deltanet = ["hipfire-runtime/deltanet", "rdna-compute/deltanet"]
# Test-only emulated EP2 harness; never enabled by default.
emulated-ep2-harness = ["deltanet"]
# Public parity-test seams; never enabled by default.
test-utils = ["deltanet"]
# Env-var-driven fault injection for the Frozen construction path
# (HIPFIRE_FROZEN_FAIL_STAGE / HIPFIRE_FROZEN_FAIL_FREE). Test-only; the
# stage injector compiles to a constant None in production builds and the
# free injector is gated off entirely in rdna-compute.
frozen-fault-inject = ["deltanet", "rdna-compute/frozen-fault-inject"]

[dependencies]
hipfire-config = { path = "../hipfire-config" }
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-arch-qwen35-vl = { path = "../hipfire-arch-qwen35-vl" }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["from-hip-error"] }
hipfire-hardware = { path = "../hipfire-hardware" }
hip-bridge = { path = "../hip-bridge" }
rdna-compute = { path = "../rdna-compute" }
hipfire-reap = { path = "../hipfire-reap" }
saddle-core = { path = "../saddle-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

[[example]]
name = "test_qwen35_load_multi"
path = "examples/test_qwen35_load_multi.rs"
required-features = ["deltanet"]

[[example]]
name = "test_qwen35_state_multi"
path = "examples/test_qwen35_state_multi.rs"
required-features = ["deltanet"]

[[example]]
name = "mtp_head_smoke"
path = "examples/mtp_head_smoke.rs"
required-features = ["deltanet"]

[[test]]
name = "test_utils_compile"
path = "tests/test_utils_compile.rs"
required-features = ["test-utils"]

[[test]]
name = "delta_net_parity"
path = "tests/delta_net_parity.rs"
required-features = ["test-utils"]
