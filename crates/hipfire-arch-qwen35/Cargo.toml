[package]
name = "hipfire-arch-qwen35"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qwen3.5 architecture (dense + MoE) for hipfire"

[features]
# Enable hybrid DeltaNet + speculative decoding paths. Currently always-on
# because qwen35 is a hybrid arch (DeltaNet + FullAttention layers).
default = ["deltanet"]
deltanet = ["hipfire-runtime/deltanet", "rdna-compute/deltanet"]

[dependencies]
hipfire-runtime = { path = "../hipfire-runtime" }
hip-bridge = { path = "../hip-bridge" }
rdna-compute = { path = "../rdna-compute" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "test_qwen35_load_multi"
path = "examples/test_qwen35_load_multi.rs"
required-features = ["deltanet"]

# tp_wo_allreduce_smoke — Stage 3a: validate the row-parallel wo partial +
# all-reduce decomposition on the real quantized wo of qwen3.5-0.8b.mq4.
[[example]]
name = "tp_wo_allreduce_smoke"
path = "examples/tp_wo_allreduce_smoke.rs"
required-features = ["deltanet"]

# tp_fa_layer_parity — Stage 3a: full FullAttn TP machinery (FaPhase
# TpAttn/all-reduce/TpFfn) vs single-GPU Full, on one real FA layer.
[[example]]
name = "tp_fa_layer_parity"
path = "examples/tp_fa_layer_parity.rs"
required-features = ["deltanet"]

# tp_attn_parity — Stage 3 acceptance: full-model TP=2 vs TP=1 logits +
# greedy-token parity (forward_scratch_tp vs forward_scratch) on 0.8B.
[[example]]
name = "tp_attn_parity"
path = "examples/tp_attn_parity.rs"
required-features = ["deltanet"]

[[example]]
name = "tp_mtp_cost"
path = "examples/tp_mtp_cost.rs"
required-features = ["deltanet"]


[[example]]
name = "test_qwen35_state_multi"
path = "examples/test_qwen35_state_multi.rs"
required-features = ["deltanet"]

[[example]]
name = "mtp_head_smoke"
path = "examples/mtp_head_smoke.rs"
required-features = ["deltanet"]
