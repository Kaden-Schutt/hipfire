[package]
name = "hipfire-arch-gemma3-spec"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lean offline spec for the Gemma-3 family (arch_id 12): arch identity + Ingest quant-policy, no runtime/kernel deps. The quantizer links this; the serving crate (hipfire-arch-gemma3) adds runtime capabilities on the same ArchId."

[dependencies]
hipfire-arch-api = { path = "../hipfire-arch-api" }
# For the ToyModel fixture's config.json only. Pure/offline; its byte-identical
# to_string_pretty output keeps the tiny-quant golden baselines stable.
serde_json = "1"
