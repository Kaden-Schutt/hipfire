#
# Vendored from redline-pub (crates/radiowave). hipfire's workspace does not
# inherit rust-version/authors/repository/homepage, so those are pinned here
# rather than taken from [workspace.package].
[package]
name = "radiowave"
version.workspace = true
edition = "2024"
rust-version = "1.85"
license.workspace = true
authors = ["Kaden Schutt"]
repository = "https://github.com/warpfront/hipfire"
homepage = "https://github.com/warpfront/hipfire"
description = "Policy-driven HIP compiler and AMDGPU code-object inspector for Redline"

[features]
default = []
# Experimental RDNA3/RDNA4 OCP FP8 recipe catalog (Wave 2+). Off by default.
experimental-fp8 = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2.0.17"

[[bin]]
name = "radiowave"
path = "src/main.rs"
