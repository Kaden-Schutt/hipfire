[package]
name = "hipfire-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hipfire command-line interface — clap frontend that embeds hipfire-server."

[[bin]]
name = "hipfire"
path = "src/main.rs"

[features]
# Forward to hipfire-server: bake prebuilt Leptos/WASM UIs into `hipfire`.
# Build the corresponding UI crate with `trunk build` first.
admin-ui-embed = ["hipfire-server/admin-ui-embed"]
chat-ui-embed = ["hipfire-server/chat-ui-embed"]
rocm = ["hipfire-diffusion/rocm"]

[dependencies]
hipfire-daemon-adapter = { path = "../hipfire-daemon-adapter" }
hipfire-build-info = { path = "../hipfire-build-info" }
hipfire-config = { path = "../hipfire-config" }
hipfire-generate = { path = "../hipfire-generate" }
hipfire-diffusion = { path = "../hipfire-diffusion" }
hipfire-lock = { path = "../hipfire-lock" }
hipfire-model = { path = "../hipfire-model" }
hipfire-server = { path = "../hipfire-server" }
clap = { version = "4", features = ["derive", "cargo"] }
regex = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
anyhow = "1"
rpassword = "7"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
clap-markdown = "0.1.5"
clap_mangen = "0.3.0"
