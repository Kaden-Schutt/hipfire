[package]
name = "hipfire-arch-cohere2moe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["from-hip-error"] }
rdna-compute = { path = "../rdna-compute" }
hip-bridge = { path = "../hip-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Mirror minimax/lfm2moe: rdna-compute host-readback helpers + hybrid-state
# plumbing live behind `deltanet`. The attention/MoE kernels the forward uses
# are ungated; the oracle dumper's per-layer download path needs it.
default = ["deltanet"]
deltanet = ["rdna-compute/deltanet", "hipfire-runtime/deltanet"]
