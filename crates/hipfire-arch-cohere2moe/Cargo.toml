[package]
name = "hipfire-arch-cohere2moe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cohere2-MoE architecture (North-Mini-Code: parallel block + interleaved sliding/global attention with NoPE on global layers + mean-centered LayerNorm + sigmoid 128-expert MoE, no renorm) for hipfire"

[features]
default = ["deltanet"]
# Mirrors hipfire-arch-minimax: the shared MoE rotate/silu helpers in
# hipfire-runtime::llama are deltanet-gated. Cohere2-MoE uses full
# rotate_half RoPE (not partial), but keeps the gate for kernel-family parity.
deltanet = ["hipfire-runtime/deltanet", "rdna-compute/deltanet"]

[dependencies]
hipfire-config = { path = "../hipfire-config" }
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["from-hip-error"] }
hipfire-hardware = { path = "../hipfire-hardware" }
hip-bridge = { path = "../hip-bridge" }
rdna-compute = { path = "../rdna-compute" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
