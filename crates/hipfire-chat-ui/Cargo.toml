[package]
name = "hipfire-chat-ui"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Leptos (WASM) browser chat console for hipfire - built standalone via trunk."

# NOTE: intentionally NOT a workspace member (see root Cargo.toml `exclude`).
# Targets wasm32 via `trunk build`; native workspace checks must skip it.

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
gloo-file = { version = "0.4", features = ["futures"] }
gloo-net = { version = "0.6", features = ["http"] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Clipboard",
    "CssStyleDeclaration",
    "DataTransfer",
    "DragEvent",
    "Element",
    "File",
    "FileList",
    "Headers",
    "HtmlElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Navigator",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "SubmitEvent",
    "TextDecoder",
    "TextDecodeOptions",
    "Window",
] }

[profile.release]
opt-level = "z"
lto = true

# Standalone workspace: this crate is excluded from the parent workspace and
# built independently by trunk (wasm32). An own `[workspace]` table makes cargo
# resolve it as its own root instead of failing to find it under the parent.
[workspace]
