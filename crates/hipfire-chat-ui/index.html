<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hipfire Chat</title>
  <link data-trunk rel="rust" data-wasm-opt="z" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8f5; --panel: #ffffff; --text: #151716; --muted: #5f6761;
      --line: #d9ded8; --accent: #126b5f; --danger: #9b2d30;
      --user: #e7f1ee; --assistant: #f2f4f7; --code: #eef1ee;
      --shadow: 0 1px 4px rgba(20, 24, 21, 0.08);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111412; --panel: #191d1a; --text: #edf0eb; --muted: #a9b0aa;
        --line: #323832; --accent: #36a78f; --danger: #e06d70;
        --user: #19332e; --assistant: #20252b; --code: #11150f; --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45; }
    button, input, textarea, select { font: inherit; }

    .shell { position: relative; height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
    .drop-target { pointer-events: none; position: absolute; inset: 8px; z-index: 10; border: 2px dashed transparent; border-radius: 8px; transition: border-color 120ms ease, background 120ms ease; }
    .shell.dragging .drop-target { border-color: var(--accent); background: color-mix(in srgb, var(--accent), transparent 88%); }

    header { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--panel); z-index: 1; }
    h1 { margin: 0; font-size: 18px; font-weight: 650; }
    .status { color: var(--muted); font-size: 13px; min-height: 20px; text-align: right; }
    .header-actions { display: flex; gap: 8px; }

    /* Settings drawer — slides in from the right, overlaying the transcript. */
    .drawer { position: absolute; top: 0; right: 0; height: 100%; width: min(360px, 86vw); z-index: 20;
      transform: translateX(102%); transition: transform 160ms ease; background: var(--panel); border-left: 1px solid var(--line);
      box-shadow: -8px 0 24px rgba(0,0,0,0.12); padding: 14px 16px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .drawer.open { transform: none; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; }
    .drawer-head strong { font-size: 15px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; min-width: 0; }
    input, select { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel); color: var(--text); }
    .system { width: 100%; min-height: 70px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel); color: var(--text); }
    .hint { margin: -4px 0 0; color: var(--muted); font-size: 12px; }
    .drawer-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted);
                   font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
    .toggle { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
    .toggle input { width: 18px; height: 18px; margin: 0; }

    .messages { min-height: 0; overflow-y: auto; padding: 18px; display: grid; align-content: start; gap: 12px; }
    .message { position: relative; width: min(900px, 100%); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow); overflow-wrap: anywhere; }
    .message .role { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 650; text-transform: uppercase; }
    .message.user { justify-self: end; background: var(--user); }
    .message.assistant { justify-self: start; background: var(--assistant); }
    .message.error { justify-self: start; border-color: color-mix(in srgb, var(--danger), var(--line) 45%); background: color-mix(in srgb, var(--danger), var(--panel) 88%); }
    .message .text { white-space: pre-wrap; }
    /* Loading indicator shown in the assistant bubble while awaiting the first
       token (covers server-side model load — which can take tens of seconds —
       plus prefill). Indeterminate: the server does not report load progress. */
    .loading { display: flex; flex-direction: column; gap: 8px; padding: 2px 0; }
    .loading-bar { position: relative; height: 4px; border-radius: 999px; overflow: hidden;
      background: color-mix(in srgb, var(--accent), transparent 82%); }
    .loading-fill { position: absolute; top: 0; left: 0; height: 100%; width: 40%; border-radius: 999px;
      background: var(--accent); animation: loading-slide 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    /* Determinate: width driven by inline style, no sliding animation. */
    .loading-bar.determinate .loading-fill { left: 0; animation: none; transition: width 280ms ease; }
    .loading-label { color: var(--muted); font-size: 13px; }
    @keyframes loading-slide { 0% { left: -42%; } 100% { left: 100%; } }
    @media (prefers-reduced-motion: reduce) { .loading-fill { animation-duration: 2.6s; } }
    .copy { position: absolute; top: 8px; right: 8px; min-height: 24px; padding: 2px 8px; font-size: 11px; opacity: 0; transition: opacity 120ms ease; }
    .message:hover .copy { opacity: 1; }

    /* Collapsible reasoning ("thinking") panel. */
    .reasoning { margin: 0 0 8px; border: 1px dashed var(--line); border-radius: 6px; background: color-mix(in srgb, var(--panel), var(--bg) 40%); }
    .reasoning summary { cursor: pointer; padding: 6px 10px; color: var(--muted); font-size: 12px; }
    .reasoning > div { padding: 0 10px 8px; color: var(--muted); font-size: 13px; white-space: pre-wrap; }

    /* Markdown body. */
    .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
    .md p { margin: 0 0 8px; } .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
    .md pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
    .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .md :not(pre) > code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
    .md blockquote { margin: 0 0 8px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
    .md table { border-collapse: collapse; margin: 0 0 8px; } .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
    .md a { color: var(--accent); }

    .message-images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .message-images img { width: min(240px, 100%); max-height: 220px; object-fit: contain; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }

    /* Composer — pinned to the bottom row of the shell grid. */
    .composer { display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; padding: 12px 18px 16px; border-top: 1px solid var(--line); background: var(--panel); z-index: 1; }
    .context-feedback { grid-column: 1 / -1; min-height: 16px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attachment-strip { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
    .attachment-strip:empty { display: none; }
    .attachment { position: relative; display: grid; grid-template-columns: 56px minmax(0, 160px) 28px; align-items: center; gap: 8px; max-width: min(100%, 280px); margin: 0; padding: 5px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
    .attachment img { width: 56px; height: 42px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
    .attachment figcaption { min-width: 0; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .attachment button { width: 28px; min-height: 28px; padding: 0; line-height: 1; }
    textarea.prompt { width: 100%; min-height: 52px; max-height: 200px; resize: none; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); color: var(--text); }

    button { min-height: 38px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; background: var(--panel); color: var(--text); cursor: pointer; }
    button.primary { min-width: 84px; align-self: end; border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 650; }
    button.primary.stop { border-color: var(--danger); background: var(--danger); }
    button:disabled { cursor: wait; opacity: 0.65; }

    @media (max-width: 760px) {
      header { grid-template-columns: 1fr auto; } .status { display: none; }
      .composer { grid-template-columns: 1fr; } button.primary { width: 100%; }
    }
  </style>
</head>
<body></body>
</html>
