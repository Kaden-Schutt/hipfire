[package]
name = "hipfire-generate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typed generation request, event, and batch-plan contracts for hipfire"

[dependencies]
hipfire-prompt = { path = "../hipfire-prompt" }
hipfire-state = { path = "../hipfire-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twox-hash = { version = "2", default-features = false, features = ["xxhash3_128"] }
