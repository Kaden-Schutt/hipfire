[package]
name = "hipfire-steer-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Daemon-backed CLI for the hipfire-steer driver. Drives capture→derive→apply→score through a hipfire-daemon (reusing its inference + chat templating + KLD) via the steer-session protocol ops, behind the hipfire-steer ModelHarness trait. The generic driver/scoring and the trait live in hipfire-steer; this crate is the DaemonHarness adapter + CLI."

[[bin]]
name = "hipfire-steer"
path = "src/main.rs"

# H-Neurons (arXiv 2512.01797) reproduction driver: capture per-sample CETT
# features via the daemon `cett_*` ops, then fit the hipfire-hneurons L1 probe.
[[bin]]
name = "hipfire-hneurons-probe"
path = "src/bin/hneurons_probe.rs"

[dependencies]
hipfire-steer = { path = "../hipfire-steer" }
hipfire-hneurons = { path = "../hipfire-hneurons" }
hipfire-daemon-adapter = { path = "../hipfire-daemon-adapter" }
hipfire-daemon-protocol = { path = "../hipfire-daemon-protocol" }
hipfire-generate = { path = "../hipfire-generate" }
hipfire-model = { path = "../hipfire-model" }
hip-bridge = { path = "../hip-bridge" }
anyhow.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "macros", "process", "time"] }
