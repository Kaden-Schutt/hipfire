[package]
name = "hipfire-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Inference orchestrator for RDNA GPUs"

[features]
# Default is the production surface: `cargo build --release` builds the
# full daemon + example set. The historical `arch-*` stubs
# (`arch-qwen35`, `arch-llama`, etc.) were empty features with no
# `cfg(feature = "arch-*")` gating and no `hipfire-runtime/arch-*`
# dependents — deleted as dead registration tax. Arch crates are consumed
# via `[dev-dependencies]` below (cycle-exclusion trick) and via
# `hipfire-loader` / `hipfire-generate`, not via runtime features.
#
# Internal example builds:
# Each arch crate already lists `hipfire-runtime` in its
# `[dependencies]`; promoting these to `[dependencies]` here would form
# a package-level cycle, which cargo rejects. To keep the cycle
# avoidance, the arch crates are listed as plain (non-optional)
# `[dev-dependencies]` of this crate. cargo's resolver excludes the
# dev-dep edge from the cycle check.
#
# Example-target gating uses `required-features` (per `[[example]]`
# block below) which serves both as documentation of which features
# each example needs and as the gate for downstream library consumers
# who attempt to build examples through their own build script.
default = ["deltanet"]
deltanet = ["rdna-compute/deltanet", "hipfire-dispatch/deltanet"]
# ep-fault-inject: enables the EP partial-load fault-injection knob
# (HIPFIRE_EP_FAIL_RANK) in the daemon example, which makes a chosen EP rank
# return a synthetic Err after uploading its weights so the staging-guard VRAM
# cleanup can be exercised on real GPUs without forcing an OOM. NOT in the
# default set: a production build (`--features deltanet`) compiles the env read
# and the synthetic-error branches OUT, so HIPFIRE_EP_FAIL_RANK has no effect.
# Build the GPU cleanup test with `--features deltanet,ep-fault-inject`.
ep-fault-inject = []
# serve-fault-inject: test-only GPU fault injection + test_state_snapshot for
# serve-hardening retry parity. NOT in the default set: production builds
# compile the generate field, one-shot after-prefill hooks, and snapshot
# command OUT. Build the GPU parity harness daemon with
# `--features deltanet,serve-fault-inject`.
serve-fault-inject = []
[dependencies]
hip-bridge = { path = "../hip-bridge" }
hipfire-config = { path = "../hipfire-config" }
rdna-compute = { path = "../rdna-compute" }
saddle-core = { path = "../saddle-core" }
hipfire-dispatch = { path = "../hipfire-dispatch" }
memmap2 = "0.9"
safetensors.workspace = true
half.workspace = true
byteorder = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: keep JSON object key insertion-order (IndexMap) instead of the
# default BTreeMap alphabetic sort. Required so request tool-definition key order
# survives parse → render → `| tojson`, byte-matching the model's trained
# chat_template (HF apply_chat_template preserves insertion order). Feature-
# unifies across the workspace build.
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
libc = "0.2"
rayon = "1"
# Inline-small token buffer for `spec::SpecStep::emit` — keeps the
# autoregressive one-token-per-step path heap-alloc-free; only large
# speculative windows spill to the heap.
smallvec = "1"
# GPT-2 / cl100k pre-tokenization for encode_gpt2_bpe. Reference encoders
# (HF tokenizers, tiktoken) chunk input via regex into ≤10-byte words/runs,
# then BPE each chunk independently; without that step the merge PQ runs
# on the whole prompt as one problem and goes O(N log N) with a huge
# constant from cross-word merges + stale-entry churn. PR #230 fixed
# per-iteration costs but not the algorithmic shape — this regex restores
# the canonical chunking.
regex = "1"
# Renders the upstream HF chat_template (Jinja) when present in
# .hfq metadata, so prompt framing matches what the model was
# trained on. Falls back to the hand-rolled `prompt_frame::ChatFrame`
# scaffolding when the template is absent or fails to render.
# `json` enables the `tojson` filter — Qwen3.5/3.6 + Gemma 4 tool-rendering
# branches use `{{ tool | tojson }}` to emit OpenAI-shape function specs
# inside the system block; without it, tool-using turns die at render time
# (caught by jinja_smoke scenario C, 2026-05-09).
minijinja = { version = "2", features = ["loop_controls", "json", "preserve_order"] }
# `pycompat` ships an unknown-method callback that makes Python
# str/list/dict methods (e.g. `.startswith`, `.split`, `.rstrip`)
# work on plain Jinja values — required by the Qwen3 family
# template which uses these throughout.
minijinja-contrib = { version = "2", features = ["pycompat"] }
tracing = "0.1"

# Examples in this crate (bench_qwen35_mq4, dflash_spec_demo, etc.)
# consume the arch crates. These are dev-dependencies — cargo refuses
# optional dev-dependencies AND its cycle checker excludes the dev-dep
# edge, which is what allows hipfire-runtime to list arch crates here
# despite each arch crate already depending on hipfire-runtime.
[dev-dependencies]
hipfire-arch-qwen35 = { path = "../hipfire-arch-qwen35" }
hipfire-arch-qwen35-vl = { path = "../hipfire-arch-qwen35-vl" }
hipfire-arch-llama = { path = "../hipfire-arch-llama" }
hipfire-arch-qwen2 = { path = "../hipfire-arch-qwen2" }
hipfire-arch-lfm2moe = { path = "../hipfire-arch-lfm2moe" }
hipfire-arch-minimax = { path = "../hipfire-arch-minimax" }
hipfire-arch-cohere2moe = { path = "../hipfire-arch-cohere2moe" }
hipfire-arch-deepseek4 = { path = "../hipfire-arch-deepseek4" }
hipfire-arch-dots-ocr = { path = "../hipfire-arch-dots-ocr" }
hipfire-arch-gemma4 = { path = "../hipfire-arch-gemma4" }
hipfire-arch-muse-glimmer = { path = "../hipfire-arch-muse-glimmer" }
hipfire-pflash = { path = "../hipfire-pflash" }
hipfire-engine = { path = "../hipfire-engine" }
hipfire-loader = { path = "../hipfire-loader" }
hipfire-detect = { path = "../hipfire-detect" }
hipfire-atlas = { path = "../hipfire-atlas" }
# In-test minimal HFQ writer (overlay resolution tests in src/hfq.rs).
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Each example below carries `required-features` when it needs a
# non-default feature (currently only `deltanet`). Arch crates are
# consumed as dev-dependencies (no `arch-*` feature gating). Examples
# not listed here (bench_q8, probe_wmma, dump_meta, …) build under any
# feature combination.

[[example]]
name = "coherence_probe"
required-features = []

[[example]]
name = "bench_qwen35_mq4"
required-features = []

[[example]]
name = "dflash_spec_demo"
required-features = []

[[example]]
name = "triattn_validate"
required-features = []

[[example]]
name = "pp_parity_chatml"
required-features = ["deltanet"]

# build_kld_ref needs no GPU / arch features — it just orchestrates
# llama-perplexity and reduces uint16 logits to top-K. Stdlib-only.
[[example]]
name = "build_kld_ref"
required-features = []

[[example]]
name = "eval_hipfire"
required-features = ["deltanet"]

# eval_gguf — KLD eval for GGUF candidates (FIFO + llama-perplexity).
# Stdlib only; no GPU / arch features.
[[example]]
name = "eval_gguf"
required-features = []

# C8 GPU sampler kernel validation — distribution-parity gate for
# batched_categorical_sample_f32 and chain_accept_spec_f32.
# No model load; uses synthetic logits on GPU.  Requires a live GPU.
[[example]]
name = "c8_sampler_validate"
required-features = []

# ─── Tier 1 calibration binaries (foundation scaffolds, 2026-05-19) ────
#
# `collect_imatrix` and `collect_hessian` are the hipfire-native
# replacements for the Tier 2 wrappers above. Both currently ship as
# `unimplemented!()` scaffolds — argument parsing + module docs only —
# so that the workspace compiles cleanly while follow-on subagent
# tasks build the forward pass, on-GPU activation/Hessian reductions,
# and the GGUF/HFHS-v1 writers on top.
#
# Stdlib only at this stage; no GPU / arch features required for the
# scaffold itself. When the forward pass lands these bins will pick up
# `required-features = ["deltanet"]` if they need GPU-gated kernels.
[[bin]]
name = "collect_imatrix"
path = "src/bin/collect_imatrix.rs"
required-features = []

[[bin]]
name = "collect_hessian"
path = "src/bin/collect_hessian.rs"
required-features = []

[[test]]
name = "arch_id_unification"
path = "tests/arch_id_unification.rs"
