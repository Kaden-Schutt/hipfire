# imatrix_collect — Phase A Step 4 (Tier 2): subprocess wrapper around
# llama-imatrix for the activation-weighted-LS calibration pipeline.
# Stdlib only; no GPU / arch features.
# ─── Tier 1 calibration ────────────────────────────────────────────────
# The native single-load calibration collector is the `collect_artifacts`
# example (Hessian + imatrix + MoE router histogram + KLDREF → one HFQM
# `.calib.hfq`), also fronted by `hipfire collect-artifacts` and the daemon
# `Collect` op. The old `collect_hessian` / `collect_imatrix` `unimplemented!()`
# scaffolds (which were to write the standalone HFHS `.hessian.bin`) were
# removed once the collector + HFQM container superseded them.
[[bin]]
name = "hipfire-host-profile"
path = "src/bin/hipfire_host_profile.rs"
required-features = []
