[package]
name = "hipfire-dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hip-bridge = { path = "../hip-bridge" }
hipfire-config = { path = "../hipfire-config" }
rdna-compute = { path = "../rdna-compute" }
# Task 10 (Escha-W2): the routed combine must multiply by f16(score); `half`
# is the workspace's RNE f32->f16 encoder and is already a transitive dep via
# rdna-compute, so this adds no build cost.
half.workspace = true

[features]
default = []
test-utils = []
new-rotation = []
new-gemv = []
new-gemm = []
new-fused-qkv = []
new-attention = []
new-moe = []
from-hip-error = []
deltanet = ["rdna-compute/deltanet"]
flash-attn-ck = ["rdna-compute/flash-attn-ck"]
