[package]
name = "hipfire-arch-nemotron"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "nemotron_h architecture (Mamba-2 + attention + MLP hybrid) for hipfire — config + block taxonomy (N0)"

[dependencies]
hipfire-mixer = { path = "../hipfire-mixer" }
hipfire-model = { path = "../hipfire-model" }
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["from-hip-error"] }
rdna-compute = { path = "../rdna-compute" }
hip-bridge = { path = "../hip-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
