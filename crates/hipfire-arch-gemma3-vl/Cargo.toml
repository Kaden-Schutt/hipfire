[package]
name = "hipfire-arch-gemma3-vl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gemma3 multimodal (SigLIP vision encoder + projector + image-token splice into the gemma3 text decoder). arch_id=13."

# Bring-up status: V1 — SigLipConfig + Gemma3VlConfig landed and unit-tested.
# SigLIP encoder forward, projector, splice, and image preproc are the remaining
# phases. Reuses hipfire-arch-gemma3 (text decoder) + qwen35-vl vision kernels.
# See docs/plans/2026-06-19-medgemma-vision-bringup.md.

[dependencies]
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-dispatch = { path = "../hipfire-dispatch" }
hip-bridge = { path = "../hip-bridge" }
rdna-compute = { path = "../rdna-compute" }
hipfire-arch-gemma3 = { path = "../hipfire-arch-gemma3" }
serde_json = "1"
# Image decode (PNG/JPEG) only — fast_image_resize does the resize.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Pillow-parity, SIMD (AVX2/SSE4.1/NEON, runtime-detected) resize — matches the
# HF Gemma3ImageProcessor bilinear convolution far more closely than image-crate
# resampling, and is the fast per-frame path for future video preprocessing.
fast_image_resize = "5"
