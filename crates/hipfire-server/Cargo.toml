[package]
name = "hipfire-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hipfire HTTP server and daemon client — axum routes, daemon engine, model discovery, config."

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures = "0.3"
async-stream = "0.3"
anyhow = "1"
hipfire-config = { path = "../hipfire-config" }
hipfire-daemon-adapter = { path = "../hipfire-daemon-adapter" }
hipfire-daemon-protocol = { path = "../hipfire-daemon-protocol" }
hipfire-model = { path = "../hipfire-model" }
hipfire-prompt = { path = "../hipfire-prompt" }
hipfire-scheduler = { path = "../hipfire-scheduler" }
