[package]
name = "hipfire-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hipfire HTTP server and daemon client — axum routes, daemon engine, model discovery, config."

[features]
# Embed the prebuilt Leptos admin UI (crates/hipfire-admin-ui/dist) into the
# binary. OFF by default so `cargo check --workspace` builds without a prior
# `trunk build`; the install flow turns it on after building the UI.
admin-ui-embed = ["dep:rust-embed"]
# Embed the prebuilt Leptos chat UI (crates/hipfire-chat-ui/dist) into the
# binary. OFF by default so normal native checks do not need a wasm toolchain.
chat-ui-embed = ["dep:rust-embed"]

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
base64.workspace = true
rust-embed = { version = "8", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
serde.workspace = true
serde_json = "1"
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures = "0.3"
async-stream = "0.3"
anyhow.workspace = true
hipfire-admin-types = { path = "../hipfire-admin-types" }
hipfire-sysinfo = { path = "../hipfire-sysinfo" }
hipfire-build-info = { path = "../hipfire-build-info" }
hipfire-config = { path = "../hipfire-config" }
hipfire-daemon-adapter = { path = "../hipfire-daemon-adapter" }
hipfire-lock = { path = "../hipfire-lock" }
hipfire-generate = { path = "../hipfire-generate" }
hipfire-diffusion = { path = "../hipfire-diffusion" }
hipfire-runtime = { path = "../hipfire-runtime", default-features = false }
hipfire-model = { path = "../hipfire-model" }
hipfire-operator = { path = "../hipfire-operator" }
hipfire-prompt = { path = "../hipfire-prompt" }
hipfire-scheduler = { path = "../hipfire-scheduler" }
hipfire-state = { path = "../hipfire-state" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tower = "0.5"
