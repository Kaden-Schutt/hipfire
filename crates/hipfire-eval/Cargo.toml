[package]
name = "hipfire-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Evaluation runner adapter for hipfire"

[[bin]]
name = "hipfire-eval"
path = "src/main.rs"

[dependencies]
hipfire-coherence = { path = "../hipfire-coherence" }
hipfire-daemon-adapter = { path = "../hipfire-daemon-adapter" }
hipfire-daemon-protocol = { path = "../hipfire-daemon-protocol" }
hipfire-evidence = { path = "../hipfire-evidence" }
# Host-profile collection (relocated out of this crate's lib.rs).
hipfire-sysinfo = { path = "../hipfire-sysinfo" }
hipfire-generate = { path = "../hipfire-generate" }
hipfire-hash = { path = "../hipfire-hash" }
hipfire-model = { path = "../hipfire-model" }
anyhow.workspace = true
base64.workspace = true
csv.workspace = true
libc.workspace = true
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
