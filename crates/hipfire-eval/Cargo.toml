[package]
name = "hipfire-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Evaluation runner adapter for hipfire"

[[bin]]
name = "hipfire-eval"
path = "src/main.rs"

[dependencies]
hipfire-coherence = { path = "../hipfire-coherence" }
hipfire-evidence = { path = "../hipfire-evidence" }
hipfire-hash = { path = "../hipfire-hash" }
hipfire-model = { path = "../hipfire-model" }
csv = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
