[package]
name = "hipfire-arch-lfm2moe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["from-hip-error"] }
hipfire-rdna = { path = "../hipfire-rdna" }
hip-bridge = { path = "../hip-bridge" }
serde.workspace = true
serde_json = "1"

[features]
# Mirror minimax: hipfire-rdna host-readback helpers and hybrid-state plumbing
# live behind `deltanet`. The conv/attention/MoE kernels the forward uses are
# ungated; the new LFM2 short-conv kernel is ungated too.
default = ["deltanet"]
deltanet = ["hipfire-rdna/deltanet", "hipfire-runtime/deltanet"]
