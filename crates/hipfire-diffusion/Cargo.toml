[package]
name = "hipfire-diffusion"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native diffusion HFQ metadata, import, and batched generation interfaces."

[dependencies]
anyhow.workspace = true
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = "1"
hipfire-primitives = { path = "../hipfire-primitives" }
hipfire-runtime = { path = "../hipfire-runtime", default-features = false }
hipfire-quantize = { path = "../hipfire-quantize" }
# Qwen2 byte-level BPE tokenizer (tokenizer.json) for the Krea2 Qwen3-VL encoder.
hipfire-model = { path = "../hipfire-model" }
rdna-compute = { path = "../rdna-compute" }
hip-bridge = { path = "../hip-bridge" }
