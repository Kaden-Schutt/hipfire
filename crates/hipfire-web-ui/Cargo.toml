[package]
name = "hipfire-web-ui"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared wasm browser helpers (fetch JSON + cancellable SSE streaming) for the hipfire Leptos UIs."

# NOTE: wasm-only (web-sys). Excluded from the parent workspace; consumed by
# the standalone chat-ui and admin-ui crates via path dependency.

[dependencies]
gloo-net = { version = "0.6", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortSignal",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "TextDecoder",
  "TextDecodeOptions",
  "Window",
] }

[workspace]
