advisor:
  enabled: false
  subagents: false
prewalk:
  enabled: false
task:
  eager: always
  batch: true
  enableEffort: false
  enableLsp: true
  maxConcurrency: 20
  maxRecursionDepth: 1
  maxRuntimeMs: 3600000
  disabledAgents:
    - composer
    - conductor
    - designer
    - efficient
    - foreman
    - hipfire-backend-engineer
    - hipfire-backend-engineer-max
    - librarian
    - reviewer
    - scout
    - shepherd
    - sonic
    - worker
  isolation:
    mode: none
tools:
  approvalMode: yolo
contextPromotion:
  enabled: false
autolearn:
  enabled: false
  autoContinue: false
goal:
  enabled: true
  statusInFooter: true
  continuationModes:
    - interactive
async:
  enabled: true
  maxJobs: 32
  pollWaitDuration: smart
compaction:
  autoContinue: true
textVerbosity: low
followUpMode: one-at-a-time
steeringMode: one-at-a-time
