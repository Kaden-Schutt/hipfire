[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",
    "E501",
    "E701",
    "E702",
    "E731",
    "E741",
    "E401",
    "F401",
    "F541",
    "F841",
]

[tool.pytest.ini_options]
norecursedirs = ["third_party"]
testpaths = [
    "tests",
]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
disable_error_code = [
    "annotation-unchecked",
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "dict-item",
    "has-type",
    "import-not-found",
    "import-untyped",
    "index",
    "list-item",
    "method-assign",
    "misc",
    "no-any-return",
    "no-untyped-def",
    "operator",
    "return-value",
    "str-bytes-safe",
    "union-attr",
    "var-annotated",
]
