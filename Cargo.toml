[workspace]
resolver = "2"
members = [
    "crates/hip-bridge",
    "crates/hsa-bridge",
    "crates/rdna-compute",
    "crates/saddle-core",
    "crates/radiowave",
    "crates/hipfire-runtime",
    "crates/hipfire-arch-qwen35",
    "crates/hipfire-pflash",
    "crates/hipfire-arch-qwen35-vl",
    "crates/hipfire-arch-llama",
    "crates/hipfire-arch-deepseek4",
    "crates/hipfire-ds4-parent",
    "crates/hipfire-arch-gemma4",
    "crates/hipfire-arch-muse-glimmer",
    "crates/hipfire-arch-toy",
    "crates/hipfire-arch-qwen2",
    "crates/hipfire-arch-lfm2moe",
    "crates/hipfire-arch-minimax",
    "crates/hipfire-arch-cohere2moe",
    "crates/hipfire-arch-dots-ocr",
    "crates/hipfire-quantize",
    "crates/hipfire-detect",
    "crates/hipfire-atlas",
    "crates/redline",
    "crates/redline-rocr",
    "crates/redline-dispatch",
    "crates/radiowave",
    "crates/hipfire-dispatch",
    "crates/hipfire-dispatch-tests",
    "crates/hipfire-tui",
    "crates/hipfire-reap",
    "crates/hipfire-loader",
    "crates/hipfire-config",
    "crates/hipfire-registry",
    "crates/hipfire-cli",
    "crates/hipfire-client",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
# Outbound license for the work as a whole. Individual files whose authors
# have not elected Apache-2.0 keep an MIT SPDX header; see LICENSE and NOTICE.
license = "Apache-2.0"

[workspace.dependencies]
half = "2.7"
libloading = "0.9"
proptest = { version = "1.11", default-features = false, features = ["std"] }
safetensors = "0.8"
