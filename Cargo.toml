[workspace]
resolver = "2"
members = [
    "crates/hip-bridge",
    "crates/hsa-bridge",
    "crates/rdna-compute",
    "crates/hipfire-admin-types",
    "crates/hipfire-coherence",
    "crates/hipfire-config",
    "crates/hipfire-cpu",
    "crates/hipfire-daemon-adapter",
    "crates/hipfire-daemon-protocol",
    "crates/hipfire-eval",
    "crates/hipfire-evidence",
    "crates/hipfire-generate",
    "crates/hipfire-hash",
    "crates/hipfire-kld",
    "crates/hipfire-lock",
    "crates/hipfire-build-info",
    "crates/hipfire-media",
    "crates/hipfire-model",
    "crates/hipfire-operator",
    "crates/hipfire-vision-cache",
    "crates/hipfire-npu",
    "crates/hipfire-prompt",
    "crates/hipfire-rocm",
    "crates/hipfire-runtime",
    "crates/hipfire-scheduler",
    "crates/hipfire-state",
    "crates/hipfire-mixer",
    "crates/hipfire-arch-qwen35",
    "crates/hipfire-arch-qwen35-vl",
    "crates/hipfire-arch-llama",
    "crates/hipfire-arch-deepseek4",
    "crates/hipfire-arch-toy",
    "crates/hipfire-arch-qwen2",
    "crates/hipfire-arch-gemma3",
    "crates/hipfire-arch-gemma3-vl",
    "crates/hipfire-arch-lfm2moe",
    "crates/hipfire-arch-minimax",
    "crates/hipfire-arch-dots-ocr",
    "crates/hipfire-arch-nemotron",
    "crates/hipfire-quantize",
    "crates/hipfire-kvquant",
    "crates/hipfire-detect",
    "crates/hipfire-atlas",
    "crates/hipfire-cli",
    "crates/hipfire-tui",
    "crates/hipfire-server",
    "crates/hipfire-serving-core",
    "crates/hipfire-daemon",
    "crates/redline",
    "crates/hipfire-dispatch",
    "crates/hipfire-dispatch-tests",
    "crates/hipfire-train",
]
# The Leptos browser UIs target wasm32 (leptos CSR + web-sys) and are built
# standalone via `trunk`, so they must NOT be workspace members — otherwise
# `cargo check --workspace` would try to compile them for the native target.
exclude = [
    "crates/hipfire-admin-ui",
    "crates/hipfire-chat-ui",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
