# The Leptos browser UIs target wasm32 (leptos CSR + web-sys) and are built
# standalone via `trunk`, so they must NOT be workspace members — otherwise
# `cargo check --workspace` would try to compile them for the native target.
exclude = [
    "crates/hipfire-admin-ui",
    "crates/hipfire-chat-ui",
    "crates/hipfire-web-ui",
    "third_party/ares",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Single-sourced versions for deps whose spec is identical in every consumer.
# Feature-bearing deps with per-crate divergence (serde_json, minijinja, tokio,
# twox-hash, image) are deliberately NOT here yet; their load-bearing features
# must be baked into the workspace default first (see the 2026-07-03 review,
# §3.11).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"
regex = "1"
base64 = "0.22"
rayon = "1"
memmap2 = "0.9"
libc = "0.2"
tracing = "0.1"
libloading = "0.8"
uuid = { version = "1", features = ["v4"] }
csv = "1"
